name: 构建发行版

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: 构建 Release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleRelease --no-daemon

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -m1 '^MAJOR_VERSION=' gradle.properties | cut -d= -f2)
          M=$(grep -m1 '^MINOR_VERSION=' gradle.properties | cut -d= -f2)
          B=$(grep -m1 '^BUILD_VERSION=' gradle.properties | cut -d= -f2)
          echo "tag=v$V.$M.$B" >> "$GITHUB_OUTPUT"
          echo "ver=$V.$M.$B" >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 应用市场 v${{ steps.ver.outputs.ver }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched: false